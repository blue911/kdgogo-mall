<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="title_co">确认订单 · KDGOGO商城</title>
<meta name="description" content="KDGOGO商城结算页：核对收货信息与商品清单，确认订单后进入支付。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23E84E0A'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='serif'>K</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#21201E; --ink-2:#5C5851; --muted:#8A857C; --paper:#FFFDF9; --warm:#F6F1E8;
  --line:#EAE3D5; --brand:#E84E0A; --brand-deep:#C24005; --brand-soft:#FCE8DB;
  --ok:#2E7D4F; --radius:14px;
  --shadow:0 12px 32px rgba(33,32,30,.10);
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
.container{max-width:1080px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== 顶栏（与首页统一） ===== */
.site-header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.header-top{display:flex;align-items:center;gap:24px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.5px;white-space:nowrap;flex:none}
.brand svg{width:30px;height:30px;flex:none}
.main-nav{display:flex;align-items:center;gap:8px;height:54px;border-top:1px solid var(--line)}
.nav-link{padding:15px 16px;border-radius:0;font-size:15px;color:var(--ink-2);white-space:nowrap;flex:none;border-bottom:2px solid transparent;text-align:center;transition:color .15s,border-color .15s,background .15s}
.nav-link:hover{color:var(--brand)}
.nav-link.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:9px;white-space:nowrap;flex:none;transition:color .15s,background .15s}
.back-link:hover{color:var(--brand);background:var(--brand-soft)}
.back-link svg{width:16px;height:16px}
.nav-toggle{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;align-items:center;justify-content:center;color:var(--ink-2)}
.nav-toggle svg{width:20px;height:20px}
.lang-select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
[dir="rtl"] .m-right{margin-left:0;margin-right:auto}
[dir="rtl"] .order-status,[dir="rtl"] .ops{margin-left:0;margin-right:auto}

/* ===== 页面主区 ===== */
.page{padding:40px 0 72px}
.page-head{margin-bottom:26px}
.page-eyebrow{display:inline-block;font-size:13px;font-weight:500;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.page-head h1{font-family:var(--font-display);font-size:34px;font-weight:900;letter-spacing:.5px}
.page-head p{color:var(--muted);font-size:14px;margin-top:8px}
.steps{display:flex;align-items:center;gap:8px;margin:22px 0 30px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
.step b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line);background:#fff}
.step.on{color:var(--brand)}
.step.on b{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done{color:var(--ok)}
.step.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.step-arrow{color:#CFC8BA;font-size:14px}

.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px}
.panel h2{font-family:var(--font-display);font-size:19px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:20px;height:20px;color:var(--brand)}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 13px;font-size:14px;color:var(--ink);transition:border .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{min-height:76px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-2);padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:none}
.row b{color:var(--ink)}
.row .muted{color:var(--muted);font-size:12px}

/* 收货方式 */
.methods{display:flex;flex-direction:column;gap:10px}
.method{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:border .15s,background .15s}
.method:hover{border-color:var(--brand)}
.method.sel{border-color:var(--brand);background:var(--brand-soft)}
.method svg{width:20px;height:20px;color:var(--brand);flex:none}
.method .m-name{font-size:14px;font-weight:600}
.method .m-desc{font-size:12px;color:var(--muted)}
.method .m-right{margin-left:auto;color:var(--brand);font-weight:700;font-size:14px}
.method input{position:absolute;opacity:0;pointer-events:none}

/* 订单商品清单 */
.order-items{display:flex;flex-direction:column}
.order-item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.order-item:last-child{border-bottom:none}
.order-item img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--warm)}
.o-name{font-size:14px;font-weight:600;line-height:1.4}
.o-sub{font-size:12px;color:var(--muted);margin-top:3px}
.o-price{font-size:14px;font-weight:700;color:var(--ink)}
.o-price small{color:var(--muted);font-weight:400;margin-right:2px}

.summary-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-2);padding:7px 0}
.summary-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.summary-total span{font-size:14px;color:var(--ink-2)}
.summary-total b{font-family:var(--font-display);font-size:28px;font-weight:900;color:var(--brand-deep)}
.summary-total small{font-size:15px;font-weight:700;margin-right:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;padding:14px 22px;border-radius:999px;transition:background .15s,transform .15s}
.btn-primary{background:var(--brand);color:#fff;width:100%}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.secure-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin-top:12px}
.secure-note svg{width:14px;height:14px;color:var(--ok)}

/* 空购物车 */
.empty-wrap{text-align:center;padding:90px 20px}
.empty-wrap svg{width:54px;height:54px;color:#CFC8BA;margin:0 auto 16px}
.empty-wrap h2{font-family:var(--font-display);font-size:24px;font-weight:900;margin-bottom:8px}
.empty-wrap p{color:var(--muted);font-size:14px;margin-bottom:26px}

/* 页脚（与首页统一） */
.site-footer{background:#242220;color:#CFC9BE;padding:56px 0 26px}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:40px}
.footer-brand b{font-family:var(--font-display);font-size:20px;color:#fff}
.footer-brand p{font-size:13px;line-height:1.8;color:#A8A196;margin-top:10px;max-width:38ch}
.footer-col b{font-size:14px;color:#fff;display:block;margin-bottom:14px}
.footer-col a,.footer-col .f-item{display:block;font-size:13px;color:#A8A196;margin-bottom:9px;transition:color .15s;cursor:pointer;background:none;border:none;text-align:left;padding:0}
.footer-col a:hover,.footer-col .f-item:hover{color:var(--brand-soft)}
.footer-bottom{border-top:1px solid #3A3833;margin-top:40px;padding-top:20px;font-size:12px;color:#8E887D;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;opacity:0;visibility:hidden;transition:all .25s;z-index:70;box-shadow:var(--shadow);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.to-top{position:fixed;right:22px;bottom:30px;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(232,78,10,.32);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s,transform .2s,visibility .2s,background .15s;z-index:45}
.to-top.show{opacity:1;visibility:visible;transform:translateY(0)}
.to-top:hover{background:var(--brand-deep)}
.to-top svg{width:22px;height:22px}
@media (max-width:760px){.to-top{right:16px;bottom:22px;width:42px;height:42px}}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  .nav-toggle{display:inline-flex}
  .main-nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:2px;height:auto;background:var(--paper);border-bottom:1px solid var(--line);border-top:none;padding:10px 20px;box-shadow:var(--shadow);display:none;z-index:41}
  .main-nav.open{display:flex}
  .main-nav .nav-link{border-bottom:none;border:1px solid transparent;border-radius:9px;padding:10px 12px;display:flex;align-items:center;justify-content:center;width:100%;background:transparent}
  .main-nav .nav-link:hover{background:var(--brand-soft);border-color:var(--brand-soft)}
  .header-top{height:60px;flex-wrap:nowrap;gap:10px}
  .header-actions{flex-wrap:nowrap;flex:1 1 auto;justify-content:flex-end;gap:8px;min-width:0}
  .lang-select{height:42px;padding:0 4px;font-size:12px}
  .footer-grid{grid-template-columns:1.4fr 1fr;gap:32px 28px}
}
@media (max-width:860px){
  .brand span{display:none}
  .layout{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .page{padding:26px 0 56px}
  .page-head h1{font-size:28px}
}
@media (max-width:700px){
  .footer-grid{grid-template-columns:1fr;gap:28px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a class="brand" href="./" data-i18n-aria="brand" aria-label="KDGOGO商城首页">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#E84E0A"/><path d="M16 8c-1.2 3.2-4 5-8 5.6V15c4.6.7 7.2 2.9 8 6.8 1-3.9 3.6-6.1 8.2-6.8v-1.4C20 13 17.2 11.2 16 8z" fill="#fff"/></svg>

            <div class="form-grid">

<script>
/* ===== 多语言 ===== */
const { t, applyLang, initLangSelect, pickProd } = KDGOGO_I18N;
const pName = p => pickProd(p, "name");

/* ===== 工具 ===== */
const $ = (s) => document.querySelector(s);
const toastEl = $("#toast");
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===== 商品数据（与首页一致的回退逻辑） ===== */
const FALLBACK_PRODUCTS = [
  {id:1, name:"轻羽降噪耳机 Pro", cat:"digital", catName:"数码", price:399, img:"assets/p01-earbuds.jpg"},
  {id:2, name:"星环智能手表 S2", cat:"digital", catName:"数码", price:899, img:"assets/p02-watch.jpg"},
  {id:3, name:"小方便携蓝牙音箱", cat:"digital", catName:"数码", price:269, img:"assets/p03-speaker.jpg"},
  {id:4, name:"奶油轴机械键盘 75%", cat:"digital", catName:"数码", price:459, img:"assets/p04-keyboard.jpg"},
  {id:5, name:"暖阳随行保温杯 500ml", cat:"life", catName:"生活好物", price:129, img:"assets/p05-bottle.jpg"},
  {id:6, name:"云朵香薰加湿器", cat:"life", catName:"生活好物", price:159, img:"assets/p06-humidifier.jpg"},
  {id:7, name:"澄光护眼台灯", cat:"life", catName:"生活好物", price:329, img:"assets/p07-lamp.jpg"},
  {id:8, name:"层序桌面收纳架", cat:"life", catName:"生活好物", price:199, img:"assets/p08-organizer.jpg"}
];
let PRODUCTS = FALLBACK_PRODUCTS;

/* ===== 购物车（与首页共用 localStorage，兼容旧键名） ===== */
let cart = {};
try { cart = JSON.parse(localStorage.getItem("kdgogo-mall-cart-v1")) || JSON.parse(localStorage.getItem("orange-mall-cart-v1")) || {}; } catch(e) { cart = {}; }
function cartEntries(){ return Object.entries(cart).map(([id,q])=>({ p: PRODUCTS.find(x=>x.id==id), q })).filter(x=>x.p); }
function goodsTotal(entries){ return entries.reduce((s,e)=> s + e.p.price*e.q, 0); }

let deliveryFee = 0;
function render(){
  const entries = cartEntries();
  if (!entries.length){
    $("#checkoutView").style.display = "none";
    $("#emptyWrap").style.display = "block";
    return;
  }
  $("#checkoutView").style.display = "grid";
  $("#orderItems").innerHTML = entries.map(e => `
    <div class="order-item">
      <img src="${e.p.img}" alt="${esc(pName(e.p))}">
      <div>
        <div class="o-name">${esc(pName(e.p))}</div>
        <div class="o-sub">¥${e.p.price} × ${e.q}</div>
      </div>
      <div class="o-price"><small>¥</small>${e.p.price * e.q}</div>
    </div>`).join("");
  updateTotals();
}

function updateTotals(){
  const entries = cartEntries();
  const goods = goodsTotal(entries);
  $("#goodsAmount").textContent = "¥" + goods;
  $("#deliveryFee").textContent = deliveryFee ? "+¥" + deliveryFee : "¥0";
  $("#totalAmount").textContent = goods + deliveryFee;
}

/* ===== 配送方式 ===== */
document.querySelectorAll("input[name=delivery]").forEach(r => {
  r.addEventListener("change", () => {
    deliveryFee = parseInt(r.value,10) || 0;
    document.querySelectorAll(".method").forEach(m => m.classList.toggle("sel", m.querySelector("input").checked));
    updateTotals();
  });
});

/* ===== 生成订单号 ===== */
function genOrderNo(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return "OY" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) +
         String(Math.floor(Math.random()*90)+10);
}

/* ===== 提交订单 ===== */
$("#submitBtn").addEventListener("click", () => {
  const name = $("#fName").value.trim();
  const phone = $("#fPhone").value.trim();
  const addr = $("#fAddr").value.trim();
  if (!name){ toast(t("err_name")); return; }
  if (!/^1\d{10}$/.test(phone)){ toast(t("err_phone")); return; }
  if (addr.length < 5){ toast(t("err_addr")); return; }
  const entries = cartEntries();
  if (!entries.length){ toast(t("err_cart")); return; }

  const orderNo = genOrderNo();
  const now = Date.now();
  const order = {
    no: orderNo,
    items: entries.map(e => ({ id:e.p.id, name:pName(e.p), img:e.p.img, price:e.p.price, qty:e.q })),
    goods: goodsTotal(entries),
    deliveryFee,
    total: goodsTotal(entries) + deliveryFee,
    receiver: { name, phone, addr, note: $("#fNote").value.trim() },
    status: "pending",                       // pending 待支付
    created: now,
    paidAt: null,
    shippedAt: null, doneAt: null
  };
  try {
    const orders = JSON.parse(localStorage.getItem("orange-mall-orders-v1")) || [];
    orders.unshift(order);
    localStorage.setItem("orange-mall-orders-v1", JSON.stringify(orders));
  } catch(e){ toast(t("err_save")); return; }

  // 跳转到支付页
  location.href = "payment.html?no=" + encodeURIComponent(orderNo);
});

/* ===== 从 API 加载商品（可选，失败保留内置） ===== */
async function loadProducts(){
  try{
    const res = await fetch("/api/products", { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("API " + res.status);
    const data = await res.json();
    if (data.ok && Array.isArray(data.products) && data.products.length){
      PRODUCTS = data.products.map(p => ({ id:p.id, name:p.name, category:p.category, cat:p.category, catName:p.catName, description:p.description||"", i18n:p.i18n||{}, price:p.price, img:p.image||"assets/hero.jpg" }));
      render();
    }
  }catch(e){}
}
/* 移动端导航菜单 */
const navToggle = $("#navToggle"), mainNav = $(".main-nav");
navToggle.addEventListener("click", () => mainNav.classList.toggle("open"));
mainNav.addEventListener("click", e => { if (e.target.closest(".nav-link")) mainNav.classList.remove("open"); });

initLangSelect(() => render());
applyLang();
render();
loadProducts();
</script>

toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
