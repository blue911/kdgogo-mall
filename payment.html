<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="title_pay">收银台 · KDGOGO商城</title>
<meta name="description" content="KDGOGO商城收银台：选择支付方式完成付款。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23E84E0A'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='serif'>K</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#21201E; --ink-2:#5C5851; --muted:#8A857C; --paper:#FFFDF9; --warm:#F6F1E8;
  --line:#EAE3D5; --brand:#E84E0A; --brand-deep:#C24005; --brand-soft:#FCE8DB;
  --ok:#2E7D4F; --radius:14px;
  --shadow:0 12px 32px rgba(33,32,30,.10);
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
.container{max-width:880px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== 顶栏（与首页统一） ===== */
.site-header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.5px;white-space:nowrap;flex:none}
.brand svg{width:30px;height:30px;flex:none}
.main-nav{display:flex;gap:4px;margin-left:8px;flex:none}
.nav-link{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--ink-2);white-space:nowrap;flex:none;transition:color .15s,background .15s}
.nav-link:hover{color:var(--brand);background:var(--brand-soft)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:9px;white-space:nowrap;flex:none;transition:color .15s,background .15s}
.back-link:hover{color:var(--brand);background:var(--brand-soft)}
.back-link svg{width:16px;height:16px}
.nav-toggle{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;align-items:center;justify-content:center;color:var(--ink-2)}
.nav-toggle svg{width:20px;height:20px}
.lang-select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
[dir="rtl"] .cashier-head .amount{text-align:left}
[dir="rtl"] .order-info{flex-direction:row}

/* ===== 主区 ===== */
.page{padding:44px 0 72px}
.steps{display:flex;align-items:center;gap:8px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.step{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
.step b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;border:1px solid var(--line);background:#fff}
.step.on{color:var(--brand)}
.step.on b{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done{color:var(--ok)}
.step.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.step-arrow{color:#CFC8BA;font-size:14px}

.cashier{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.cashier-head{display:flex;align-items:center;gap:14px;padding:22px 28px;border-bottom:1px solid var(--line);background:var(--warm)}
.cashier-head .ico{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:none}
.cashier-head .ico svg{width:24px;height:24px;color:var(--brand)}
.cashier-head .t1{font-size:12px;color:var(--muted)}
.cashier-head .t2{font-family:var(--font-display);font-size:22px;font-weight:900;line-height:1.3}
.cashier-head .t2 span{color:var(--brand-deep)}
.cashier-head .amount{margin-left:auto;text-align:right}
.cashier-head .amount .lbl{font-size:12px;color:var(--muted)}
.cashier-head .amount b{font-family:var(--font-display);font-size:30px;font-weight:900;color:var(--brand-deep)}
.cashier-head .amount small{font-size:17px;font-weight:700;margin-right:1px}

.order-info{padding:20px 28px 0;display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.order-info b{color:var(--ink);font-weight:600}
.order-info .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:.4px}

.methods{padding:24px 28px;display:flex;flex-direction:column;gap:12px}
.methods-title{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.method{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer;transition:border .15s,background .15s;position:relative}
.method:hover{border-color:var(--brand)}
.method.sel{border-color:var(--brand);background:var(--brand-soft)}
.method .logo{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.method .logo svg{width:22px;height:22px}
.method .m-name{font-size:15px;font-weight:600}
.method .m-desc{font-size:12px;color:var(--muted);margin-top:2px}
.method .radio{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.method.sel .radio{border-color:var(--brand)}
.method.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.method input{position:absolute;opacity:0;pointer-events:none}

.pay-area{padding:0 28px 26px}
.pay-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--brand);color:#fff;font-size:16px;font-weight:600;padding:15px;border-radius:12px;transition:background .15s,transform .15s}
.pay-btn:hover{background:var(--brand-deep);transform:translateY(-1px)}
.pay-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.countdown{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.secure-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);padding:14px 28px 20px;border-top:1px dashed var(--line)}
.secure-note svg{width:14px;height:14px;color:var(--ok)}

/* 成功态 */
.success-wrap{text-align:center;padding:64px 28px 58px}
.success-wrap .badge{width:74px;height:74px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:0 10px 26px rgba(46,125,79,.28)}
.success-wrap .badge svg{width:36px;height:36px}
.success-wrap h2{font-family:var(--font-display);font-size:26px;font-weight:900;margin-bottom:8px}
.success-wrap p{color:var(--ink-2);font-size:14px;margin-bottom:8px}
.success-wrap .order-no{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--brand-deep);background:var(--brand-soft);padding:6px 14px;border-radius:999px;display:inline-block;margin:6px 0 24px}
.success-wrap .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;padding:13px 26px;border-radius:999px;transition:background .15s,transform .15s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}

.hide{display:none!important}

/* 页脚（与首页统一） */
.site-footer{background:#242220;color:#CFC9BE;padding:56px 0 26px;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:40px}
.footer-brand b{font-family:var(--font-display);font-size:20px;color:#fff}
.footer-brand p{font-size:13px;line-height:1.8;color:#A8A196;margin-top:10px;max-width:38ch}
.footer-col b{font-size:14px;color:#fff;display:block;margin-bottom:14px}
.footer-col a,.footer-col .f-item{display:block;font-size:13px;color:#A8A196;margin-bottom:9px;transition:color .15s;cursor:pointer;background:none;border:none;text-align:left;padding:0}
.footer-col a:hover,.footer-col .f-item:hover{color:var(--brand-soft)}
.footer-bottom{border-top:1px solid #3A3833;margin-top:40px;padding-top:20px;font-size:12px;color:#8E887D;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;opacity:0;visibility:hidden;transition:all .25s;z-index:70;box-shadow:var(--shadow);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  .nav-toggle{display:inline-flex}
  .main-nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;box-shadow:var(--shadow);display:none;z-index:41}
  .main-nav.open{display:flex}
  .header-inner{height:auto;padding:12px 0;flex-wrap:wrap;gap:10px}
  .header-actions{flex-wrap:wrap;flex:1 1 auto;justify-content:flex-end}
  .footer-grid{grid-template-columns:1.4fr 1fr;gap:32px 28px}
}
@media (max-width:700px){
  .page{padding:26px 0 56px}
  .footer-grid{grid-template-columns:1fr;gap:28px}
  .cashier-head{flex-wrap:wrap}
  .cashier-head .amount{margin-left:0;width:100%;text-align:left}
  .order-info{flex-direction:column}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="./" data-i18n-aria="brand" aria-label="KDGOGO商城首页">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#E84E0A"/><path d="M16 8c-1.2 3.2-4 5-8 5.6V15c4.6.7 7.2 2.9 8 6.8 1-3.9 3.6-6.1 8.2-6.8v-1.4C20 13 17.2 11.2 16 8z" fill="#fff"/></svg>

<script>
/* ===== 多语言 ===== */
const { t, applyLang, initLangSelect } = KDGOGO_I18N;

/* ===== 工具 ===== */
const $ = (s) => document.querySelector(s);
const toastEl = $("#toast");
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===== 读取当前订单 ===== */
const params = new URLSearchParams(location.search);
const orderNo = (params.get("no") || "").trim();
let order = null;
let orders = [];
try { orders = JSON.parse(localStorage.getItem("orange-mall-orders-v1")) || []; } catch(e) { orders = []; }
if (orderNo) order = orders.find(o => o.no === orderNo) || null;

if (!order || order.status !== "pending"){
  // 订单不存在或已支付/超时：回到首页
  location.replace("./");
}

function refreshFromStorage(){
  try { orders = JSON.parse(localStorage.getItem("orange-mall-orders-v1")) || []; } catch(e){ orders = []; }
  order = orderNo ? (orders.find(o => o.no === orderNo) || null) : null;
}

/* ===== 渲染 ===== */
const PAY_LABEL_KEY = { alipay:"m_alipay", wechat:"m_wechat", card:"m_card" };
const payLabel = (k) => t(PAY_LABEL_KEY[k] || "m_card");
let countdownLeft = 30 * 60;
let countdownTimer = null;

function render(){
  $("#orderNoHead").textContent = order.no;
  $("#payAmount").textContent = order.total;
  $("#payBtnAmount").textContent = order.total;
  $("#receiverLine").textContent = esc(order.receiver.name + "  " + order.receiver.phone);
  $("#qtyLine").textContent = order.items.reduce((s,i)=>s+i.qty,0) + " " + t("qty_unit");
}

function updateCountdown(){
  const m = String(Math.floor(countdownLeft/60)).padStart(2,"0");
  const s = String(countdownLeft%60).padStart(2,"0");
  $("#countdown").textContent = t("countdown_t", { m, s });
  if (countdownLeft <= 0){
    clearInterval(countdownTimer);
    expireOrder();
  }
}
function expireOrder(){
  refreshFromStorage();
  if (!order || order.status !== "pending") return;
  order.status = "closed";
  order.closedAt = Date.now();
  saveOrders();
  toast(t("toast_closed"));
  location.href = "orders.html?status=closed";
}
function saveOrders(){
  try { localStorage.setItem("orange-mall-orders-v1", JSON.stringify(orders)); } catch(e){}
}

/* ===== 支付方式 ===== */
document.querySelectorAll("input[name=pay]").forEach(r => {
  r.addEventListener("change", () => {
    document.querySelectorAll(".method").forEach(m => m.classList.toggle("sel", m.querySelector("input").checked));
  });
});

/* ===== 模拟支付 ===== */
let paying = false;
$("#payBtn").addEventListener("click", () => {
  if (paying) return;
  refreshFromStorage();
  if (!order || order.status !== "pending"){ toast(t("toast_status")); return; }
  const method = payLabel(document.querySelector("input[name=pay]:checked").value);
  paying = true;
  const btn = $("#payBtn");
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5v6c0 5 3.2 8.6 7.5 10.5 4.3-1.9 7.5-5.5 7.5-10.5V5z"/><path d="M8.8 11.8l2.2 2.2 4.2-4.4"/></svg> ${t("redirecting", { method })}`;

  // 模拟支付网关回调（2 秒后支付成功）
  setTimeout(() => {
    refreshFromStorage();
    if (!order || order.status !== "pending"){ toast(t("toast_status2")); return; }
    order.status = "paid";
    order.paidAt = Date.now();
    order.payMethod = method;
    saveOrders();
    clearInterval(countdownTimer);
    // 清空购物车（该订单对应的商品）
    let cart = {};
    try { cart = JSON.parse(localStorage.getItem("kdgogo-mall-cart-v1")) || JSON.parse(localStorage.getItem("orange-mall-cart-v1")) || {}; } catch(e){ cart = {}; }
    order.items.forEach(i => { delete cart[i.id]; });
    try { localStorage.setItem("kdgogo-mall-cart-v1", JSON.stringify(cart)); } catch(e){}
    $("#successNo").textContent = order.no;
    $("#cashier").classList.add("hide");
    $("#successView").classList.remove("hide");
    window.scrollTo({ top:0, behavior:"smooth" });
  }, 2000);
});

/* ===== 移动端导航菜单 ===== */
const navToggle = $("#navToggle"), mainNav = $(".main-nav");
if (navToggle && mainNav){
  navToggle.addEventListener("click", () => mainNav.classList.toggle("open"));
  mainNav.addEventListener("click", e => { if (e.target.closest(".nav-link")) mainNav.classList.remove("open"); });
}

/* ===== 启动 ===== */
initLangSelect(() => { if (order && order.status === "pending") render(); });
applyLang();
if (order && order.status === "pending"){
  render();
  updateCountdown();
  countdownTimer = setInterval(() => { countdownLeft--; updateCountdown(); }, 1000);
}
</script>
</body>
</html>
