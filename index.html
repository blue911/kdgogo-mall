<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="title_home">KDGOGO商城 · 数码与生活好物</title>
<meta name="description" content="KDGOGO商城：精选数码与生活好物，搜索筛选、购物车本地持久化，正品保障、极速发货。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23E84E0A'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='serif'>K</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ============ 基础与变量 ============ */
:root{
  --ink:#21201E;
  --ink-2:#5C5851;
  --muted:#8A857C;
  --paper:#FFFDF9;
  --warm:#F6F1E8;
  --line:#EAE3D5;
  --brand:#E84E0A;
  --brand-deep:#C24005;
  --brand-soft:#FCE8DB;
  --ok:#2E7D4F;
  --radius:14px;
  --shadow:0 12px 32px rgba(33,32,30,.10);
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============ 顶栏 ============ */
.site-header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.5px}
.brand svg{width:30px;height:30px;flex:none}
.main-nav{display:flex;gap:4px;margin-left:8px}
.nav-link{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--ink-2);transition:color .15s,background .15s}
.nav-link:hover{color:var(--brand);background:var(--brand-soft)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.search-box{position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:12px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-box input{width:210px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px 0 38px;font-size:14px;color:var(--ink);transition:border .15s,box-shadow .15s}
.search-box input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cart-btn{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;transition:border .15s,color .15s}
.cart-btn:hover{border-color:var(--brand);color:var(--brand)}
.cart-btn svg{width:20px;height:20px}
.admin-link{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px;transition:color .15s,background .15s}
.admin-link:hover{color:var(--brand);background:var(--brand-soft)}
.cart-badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.cart-badge.hide{display:none}
.lang-select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:13px;color:var(--ink-2);cursor:pointer}
.nav-toggle{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;align-items:center;justify-content:center;color:var(--ink-2)}
.nav-toggle svg{width:20px;height:20px}

/* RTL（阿拉伯语等从右向左语言）方向适配 */
[dir="rtl"] .header-actions{margin-left:0;margin-right:auto}
[dir="rtl"] .main-nav{margin-left:0;margin-right:8px}
[dir="rtl"] .result-count{margin-left:0;margin-right:auto}
[dir="rtl"] .ops{justify-content:flex-start}
[dir="rtl"] .gal-arrow.prev{left:auto;right:12px}
[dir="rtl"] .gal-arrow.next{right:auto;left:12px}
[dir="rtl"] .cart-item-right{align-items:flex-start}

/* ============ Hero ============ */
.hero{padding:52px 0 28px}
.hero-inner{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
.hero-eyebrow{display:inline-block;font-size:13px;font-weight:500;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px;margin-bottom:18px}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:52px;line-height:1.18;letter-spacing:1px}
.hero h1 .accent{color:var(--brand)}
.hero-sub{margin-top:18px;font-size:16px;color:var(--ink-2);max-width:46ch}
.hero-cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn-primary{background:var(--brand);color:#fff;font-size:15px;font-weight:600;padding:13px 26px;border-radius:999px;transition:background .15s,transform .15s}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px;font-weight:600;padding:13px 26px;border-radius:999px;transition:border .15s,color .15s}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.hero-stats{display:flex;gap:0;margin-top:36px}
.stat{flex:1;padding:0 20px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:none}
.stat b{font-family:var(--font-display);font-size:26px;font-weight:900;display:block;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.hero-media{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.hero-media img{width:100%;height:430px;object-fit:cover}

/* ============ 服务条 ============ */
.perks{padding:26px 0}
.perks-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.perk{display:flex;align-items:center;gap:12px;background:var(--warm);border-radius:12px;padding:14px 16px}
.perk svg{width:22px;height:22px;color:var(--brand);flex:none}
.perk b{font-size:14px;font-weight:600;display:block}
.perk span{font-size:12px;color:var(--muted)}

/* ============ 商品区 ============ */
.catalog{padding:48px 0 72px}
.section-head{margin-bottom:26px}
.section-head h2{font-family:var(--font-display);font-size:32px;font-weight:900}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--line);background:#fff;padding:8px 18px;border-radius:999px;font-size:14px;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.result-count{margin-left:auto;font-size:13px;color:var(--muted)}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-media{position:relative;aspect-ratio:1/1;background:var(--warm);overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .card-media img{transform:scale(1.05)}
.card-tag{position:absolute;top:10px;left:10px;background:rgba(33,32,30,.78);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.card-tag.hot{background:var(--brand)}
.card-tag.oos{background:#6B6660}
.card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-name{font-size:15px;font-weight:600;line-height:1.45;cursor:pointer}
.card-name:hover{color:var(--brand)}
.card-sub{font-size:12px;color:var(--muted)}
.card-rating{display:flex;align-items:center;gap:6px}
.stars{display:flex;gap:2px}
.stars svg{width:14px;height:14px}
.stars svg.off{color:#D8D2C6}
.card-score{font-size:12px;color:var(--muted)}
.card-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;gap:8px}
.price{font-family:var(--font-display);font-size:21px;font-weight:900;color:var(--brand-deep)}
.price small{font-size:13px;font-weight:700;margin-right:1px}
.price-old{font-family:var(--font-ui);font-size:13px;color:var(--muted);text-decoration:line-through;font-weight:400}
.price-old small{font-size:11px}
.ship-badge{font-size:11px;color:var(--ok);margin-top:2px}
.btn-add{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;transition:background .15s,transform .15s}
.btn-add:hover{background:var(--brand-deep)}
.btn-add:disabled{background:#C9C2B6;cursor:not-allowed}
.btn-add svg{width:15px;height:15px}
.empty{display:none;text-align:center;padding:70px 0;color:var(--muted)}
.empty.show{display:block}
.empty svg{width:44px;height:44px;color:#CFC8BA;margin:0 auto 14px}

/* ============ 页脚 ============ */
.site-footer{background:#242220;color:#CFC9BE;padding:56px 0 26px}
.footer-grid{display:grid-template-columns:1.6fr 1fr 1.2fr;display:grid;gap:40px}
.footer-brand b{font-family:var(--font-display);font-size:20px;color:#fff}
.footer-brand p{font-size:13px;line-height:1.8;color:#A8A196;margin-top:10px;max-width:38ch}
.footer-col b{font-size:14px;color:#fff;display:block;margin-bottom:14px}
.footer-col a,.footer-col .f-item{display:block;font-size:13px;color:#A8A196;margin-bottom:9px;transition:color .15s;cursor:pointer;background:none;border:none;text-align:left;padding:0}
.footer-col a:hover,.footer-col .f-item:hover{color:var(--brand-soft)}
.footer-bottom{border-top:1px solid #3A3833;margin-top:40px;padding-top:20px;font-size:12px;color:#8E887D;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(33,32,30,.46);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:50}
.overlay.show{opacity:1;visibility:visible}
.modal{position:fixed;inset:0;z-index:51;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.modal.show{opacity:1;visibility:visible}
.modal-panel{background:#fff;border-radius:18px;max-width:780px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1.1fr;box-shadow:var(--shadow)}
.modal-media{position:relative;background:var(--warm)}
.modal-media img{width:100%;height:100%;object-fit:cover;min-height:340px}
.modal-info{padding:28px 28px 30px;display:flex;flex-direction:column;gap:12px}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:color .15s,transform .15s;z-index:2}
.modal-close:hover{color:var(--brand);transform:rotate(90deg)}
.modal-close svg{width:16px;height:16px}
.modal h3{font-family:var(--font-display);font-size:24px;font-weight:900;line-height:1.3}
.modal-desc{font-size:14px;color:var(--ink-2)}
.modal-meta{font-size:12px;color:var(--muted)}
.modal-feats{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:2px}
.modal-feats li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.modal-feats svg{width:15px;height:15px;color:var(--ok);flex:none;margin-top:3px}
.modal-price-row{display:flex;align-items:center;gap:18px;margin-top:6px;flex-wrap:wrap}
.modal-price{font-family:var(--font-display);font-size:30px;font-weight:900;color:var(--brand-deep)}
.modal-actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff}
.qty button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:color .15s}
.qty button:hover{color:var(--brand)}
.qty button svg{width:15px;height:15px}
.qty em{min-width:36px;text-align:center;font-style:normal;font-size:15px;font-weight:600}
.modal-note{font-size:12px;color:var(--muted);margin-top:6px}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-2);z-index:2}
.gal-arrow:hover{color:var(--brand)}
.gal-arrow.prev{left:12px}
.gal-arrow.next{right:12px}
.gal-thumbs{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:2}
.gal-thumbs img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;background:#fff}
.gal-thumbs img.sel{border-color:var(--brand)}

/* ============ 购物车抽屉 ============ */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:52;transform:translateX(103%);transition:transform .32s ease;display:flex;flex-direction:column;box-shadow:-14px 0 36px rgba(33,32,30,.16)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-family:var(--font-display);font-size:20px;font-weight:900}
.drawer-body{flex:1;overflow:auto;padding:8px 22px}
.cart-item{display:grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line);display:grid}
.cart-item img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--warm)}
.cart-item-name{font-size:14px;font-weight:600;line-height:1.4}
.cart-item-price{font-size:12px;color:var(--muted);margin-top:3px}
.cart-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.cart-item .qty button{width:28px;height:28px}
.cart-remove{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);transition:color .15s}
.cart-remove:hover{color:var(--brand-deep)}
.cart-remove svg{width:14px;height:14px}
.cart-empty{padding:64px 0;text-align:center;color:var(--muted)}
.cart-empty svg{width:42px;height:42px;color:#CFC8BA;margin:0 auto 12px}
.drawer-foot{border-top:1px solid var(--line);padding:18px 22px 22px}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-2);margin-bottom:14px}
.subtotal b{font-family:var(--font-display);font-size:24px;font-weight:900;color:var(--brand-deep)}
.drawer-actions{display:flex;flex-direction:column;gap:10px}
.btn-checkout{background:var(--brand);color:#fff;font-size:15px;font-weight:600;padding:13px;border-radius:12px;transition:background .15s}
.btn-checkout:hover{background:var(--brand-deep)}
.btn-clear{border:1px solid var(--line);color:var(--ink-2);font-size:13px;padding:10px;border-radius:12px;transition:border .15s,color .15s}
.btn-clear:hover{border-color:var(--brand-deep);color:var(--brand-deep)}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;opacity:0;visibility:hidden;transition:all .25s;z-index:70;box-shadow:var(--shadow);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

/* ============ 响应式 ============ */
@media (max-width:1080px){
  .product-grid{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:42px}
  .perks-inner{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .nav-toggle{display:inline-flex}
  .main-nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;box-shadow:var(--shadow);display:none;z-index:41}
  .main-nav.open{display:flex}
  .header-inner{height:auto;padding:12px 0;flex-wrap:wrap;gap:10px}
  .header-actions{flex-wrap:wrap}
  .search-box{order:3;flex-basis:100%}
  .search-box input{width:100%}
  .hero{padding:32px 0 10px}
  .hero-inner{grid-template-columns:1fr;gap:28px}
  .hero h1{font-size:34px}
  .hero-media img{height:240px}
  .hero-stats{margin-top:26px}
  .stat b{font-size:21px}
  .catalog{padding:34px 0 56px}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .section-head h2{font-size:26px}
  .result-count{margin-left:0;flex-basis:100%}
  .footer-grid{grid-template-columns:1fr;gap:28px}
  .modal-panel{grid-template-columns:1fr;max-height:92vh}
  .modal-media img{min-height:0;height:260px}
  .modal-close{position:absolute}
}
@media (max-width:480px){
  .product-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#home" data-i18n-aria="brand" aria-label="KDGOGO商城首页">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#E84E0A"/><path d="M16 8c-1.2 3.2-4 5-8 5.6V15c4.6.7 7.2 2.9 8 6.8 1-3.9 3.6-6.1 8.2-6.8v-1.4C20 13 17.2 11.2 16 8z" fill="#fff"/></svg>
      <span data-i18n="brand"></span>
    </a>
    <button class="nav-toggle" id="navToggle" data-i18n-aria="menu" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="main-nav" aria-label="主导航">
      <button class="nav-link" data-goto="home" data-i18n="nav_home"></button>
      <button class="nav-link" data-goto="shop" data-i18n="nav_all"></button>
      <button class="nav-link" data-filter-new="1" data-i18n="nav_new"></button>
      <a class="nav-link" href="orders.html" data-i18n="nav_orders"></a>
      <button class="nav-link" data-goto="about" data-i18n="nav_about"></button>
    </nav>
    <div class="header-actions">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="searchInput" data-i18n-ph="search_ph" data-i18n-aria="search_ph" placeholder="搜索好物" aria-label="搜索商品">
      </label>
      <select class="lang-select" id="langSelect" aria-label="语言">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="pt">Português</option>
        <option value="de">Deutsch</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="tr">Türkçe</option>
      </select>
      <button class="cart-btn" id="cartBtn" aria-label="打开购物车">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>
        <span class="cart-badge hide" id="cartBadge">0</span>
      </button>
      <a class="admin-link" href="admin.html" aria-label="进入管理后台" data-i18n="admin"></a>
    </div>
  </div>
</header>

<main>
  <!-- ===== 视图：Hero ===== -->
  <section class="hero" id="home">
    <div class="container hero-inner">

<script>
/* ===== 多语言（共享脚本 assets/i18n.js） ===== */
const { t, applyLang, initLangSelect, pickProd, pickFeats, pickCat } = KDGOGO_I18N;
/* 商品文案取值（含回退）：名称 / 描述 / 分类 / 卖点 */

const pDesc = p => pickProd(p, "description") || p.desc || "";
const pCat = p => pickCat(p);
const pFeats = p => pickFeats(p);


/* ===== 数据 ===== */

   img:"assets/p05-bottle.jpg", desc:"316 不锈钢内胆，冬日热饮夏日冰爽。", brand:"KDGOGO", model:"Bottle 500",
   original_price:159, stock:120, free_shipping:true, shipping_fee:0,
   feats:["316 不锈钢内胆，食品级安全","保温 12 小时 / 保冷 24 小时","单手开盖，配可拎硅胶提绳"]},
  {id:6, name:"云朵香薰加湿器", cat:"life", catName:"生活好物", price:159, rating:4.7, isNew:true,
   img:"assets/p06-humidifier.jpg", desc:"细密水雾与木质底座，桌面多一份宁静。", brand:"KDGOGO", model:"Humidifier",
   original_price:0, stock:71, free_shipping:false, shipping_fee:8,
   feats:["超声波雾化，出雾细腻安静","可加精油，营造放松氛围","低于 30dB 静音运行，断电缺水保护"]},
  {id:7, name:"澄光护眼台灯", cat:"life", catName:"生活好物", price:329, rating:4.8, isNew:false,
   img:"assets/p07-lamp.jpg", desc:"无频闪柔光，护眼从一盏灯开始。", brand:"KDGOGO", model:"Lamp AA",
   original_price:369, stock:45, free_shipping:true, shipping_fee:0,
   feats:["无频闪全光谱光源，国标 AA 级照度","三档色温可调，亮度记忆","金属灯臂，多角度自由调节"]},
  {id:8, name:"层序桌面收纳架", cat:"life", catName:"生活好物", price:199, rating:4.6, isNew:false,
   img:"assets/p08-organizer.jpg", desc:"实木三层，桌面杂物各归其位。", brand:"KDGOGO", model:"Organizer 3",
   original_price:0, stock:29, free_shipping:true, shipping_fee:0,
   feats:["三层实木搁板 + 金属支架，稳固承重","免安装设计，开箱即用","原木纹理，适配多种家居风格"]}
];

/* 商品数据：默认回退到内置数据，页面加载后尝试从后端 API 拉取覆盖 */
let PRODUCTS = FALLBACK_PRODUCTS;

/* ===== 状态 ===== */
let filter = "all";
let query = "";
let modalQty = 1;
let modalId = null;
let modalImages = [];
let modalImgIdx = 0;
let cart = {};
try { cart = JSON.parse(localStorage.getItem("kdgogo-mall-cart-v1")) || JSON.parse(localStorage.getItem("orange-mall-cart-v1")) || {}; } catch(e) { cart = {}; }

const $ = (s) => document.querySelector(s);
const grid = $("#grid"), emptyEl = $("#empty"), toastEl = $("#toast");
const drawer = $("#drawer"), modal = $("#modal"), overlay = $("#overlay");
let toastTimer = null;

/* ===== 工具 ===== */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return "¥" + n; }
function starSvg(on){ return `<svg viewBox="0 0 24 24" ${on?'':'class="off"'} fill="currentColor"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18.1l-5.8 3 1.1-6.5L2.6 9.6l6.5-.9z"/></svg>`; }
function starsHtml(r){ let s=""; for(let i=1;i<=5;i++){ s += starSvg(i <= Math.round(r)); } return `<span class="stars">${s}</span>`; }
function iconCart(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>`; }
function shipText(p){ return p.free_shipping ? t("free_ship") : t("ship_fee", {n: p.shipping_fee || 0}); }
function priceHtml(p){
  const old = p.original_price && p.original_price > p.price ? `<span class="price-old"><small>¥</small>${p.original_price}</span>` : "";
  return `${old}<span class="price"><small>¥</small>${p.price}</span>`;
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* ===== 分类（动态：来自后台已有商品） ===== */
function catList(){
  const map = new Map();
  PRODUCTS.forEach(p => { if (!map.has(p.cat)) map.set(p.cat, pCat(p)); });
  return [...map.entries()].map(([slug,name]) => ({ slug, name }));
}

function renderChips(){
  const box = $("#filters");
  const cats = catList();
  box.innerHTML =
    `<button class="chip ${filter==='all'?'active':''}" data-cat="all">${t("all")}</button>` +
    cats.map(c => `<button class="chip ${filter===c.slug?'active':''}" data-cat="${esc(c.slug)}">${esc(c.name)}</button>`).join("") +
    `<span class="result-count" id="resultCount"></span>`;
}

/* ===== 商品渲染 ===== */
function visibleProducts(){
  const q = query.trim().toLowerCase();
  return PRODUCTS.filter(p => {
    if (p.on_sale === false) return false;
    if (filter === "new" && !p.isNew) return false;
    if (filter !== "all" && filter !== "new" && p.cat !== filter) return false;
    if (q && !(pName(p).toLowerCase().includes(q) || pCat(p).toLowerCase().includes(query.trim()))) return false;
    return true;
  });
}

function renderGrid(){
  const list = visibleProducts();
  const rc = $("#resultCount");
  if (rc) rc.textContent = t("count", {n: list.length});
  if (!list.length){
    emptyEl.classList.add("show");
    grid.innerHTML = "";
    return;
  }
  emptyEl.classList.remove("show");
  grid.innerHTML = list.map(p => {
    const oos = (p.stock ?? 1) <= 0;
    const tag = oos
      ? `<span class="card-tag oos">${t("tag_oos")}</span>`
      : p.isNew ? `<span class="card-tag hot">${t("tag_new")}</span>`
      : `<span class="card-tag">${esc(pCat(p))}</span>`;
    const sub = [p.brand, p.model].filter(Boolean).join(" · ");
    return `
    <article class="card" data-id="${p.id}">
      <div class="card-media">
        ${tag}
        <img src="${p.img}" alt="${esc(pName(p))}" loading="lazy">
      </div>
      <div class="card-body">
        <h3 class="card-name">${esc(pName(p))}</h3>
        ${sub ? `<div class="card-sub">${esc(sub)}</div>` : ""}
        <div class="card-rating">${starsHtml(p.rating)}<span class="card-score">${p.rating.toFixed(1)}${t("score_suffix")}</span></div>
        <div class="ship-badge">${shipText(p)}</div>
        <div class="card-price-row">
          ${priceHtml(p)}
          <button class="btn-add" data-add="${p.id}" ${oos?'disabled':''} aria-label="${t("add")}">${iconCart()}${t("add")}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

/* ===== 购物车 ===== */
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((s,[id,q]) => s + (PRODUCTS.find(p=>p.id==id)?.price||0)*q, 0); }

function saveCart(){
  try { localStorage.setItem("kdgogo-mall-cart-v1", JSON.stringify(cart)); } catch(e) {}
  renderCart();
}

function renderCart(){
  const badge = $("#cartBadge");
  const n = cartCount();
  badge.textContent = n;
  badge.classList.toggle("hide", n === 0);
  const body = $("#drawerBody");
  const entries = Object.entries(cart);
  if (!entries.length){
    body.innerHTML = `<div class="cart-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>
      <p>${t("cart_empty")}</p>
      <button class="btn-ghost" id="goShop">${t("go_shop")}</button>
    </div>`;
    $("#subtotal").textContent = "¥0";
    return;
  }
  body.innerHTML = entries.map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    if (!p) return "";
    return `<div class="cart-item">
      <img src="${p.img}" alt="${esc(pName(p))}">
      <div>
        <div class="cart-item-name">${esc(pName(p))}</div>
        <div class="cart-item-price">¥${p.price} × ${qty}</div>
      </div>
      <div class="cart-item-right">
        <div class="qty">
          <button data-dec="${id}" aria-label="减少"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <em>${qty}</em>
          <button data-inc="${id}" aria-label="增加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <button class="cart-remove" data-rm="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m3 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7"/></svg>${t("removed")}</button>
      </div>
    </div>`;
  }).join("");
  $("#subtotal").textContent = fmt(cartTotal());
}

function addToCart(id, qty){
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  if ((p.stock ?? 1) <= 0) { toast(t("oos")); return; }
  cart[id] = (cart[id] || 0) + qty;
  saveCart();
  toast(t("added", {name: pName(p)}));
}

/* ===== 详情弹窗 ===== */
function openModal(id){
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  modalId = id; modalQty = 1;
  modalImages = (p.images && p.images.length) ? p.images : [p.img];
  modalImgIdx = 0;
  showModalImage();
  $("#modalCat").textContent = pCat(p) + (p.isNew ? " · " + t("tag_new") : "");
  $("#modalName").textContent = pName(p);
  const sub = [p.brand, p.model].filter(Boolean).join(" · ");
  $("#modalMeta").textContent = sub + (sub ? " · " : "") + shipText(p) + ((p.stock ?? 1) <= 0 ? " · " + t("tag_oos") : "");
  $("#modalDesc").textContent = pDesc(p);
  $("#modalFeats").innerHTML = pFeats(p).map(f => `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>${esc(f)}</li>`).join("");
  $("#modalPrice").innerHTML = priceHtml(p).replace('class="price"', 'class="modal-price"');
  $("#modalRating").innerHTML = starsHtml(p.rating) + `<span class="card-score">${p.rating.toFixed(1)}${t("score_suffix")}</span>`;
  $("#qtyVal").textContent = 1;
  $("#modalAdd").disabled = (p.stock ?? 1) <= 0;
  modal.classList.add("show");
  overlay.classList.add("show");
}
function showModalImage(){
  const src = modalImages[modalImgIdx] || modalImages[0];
  $("#modalImg").src = src;
  $("#modalImg").alt = $("#modalName").textContent;
  $("#galThumbs").innerHTML = modalImages.map((im,i) =>
    `<img src="${im}" data-i="${i}" class="${i===modalImgIdx?'sel':''}" alt="">`).join("");
  $("#galThumbs").querySelectorAll("img").forEach(im => {
    im.addEventListener("click", () => { modalImgIdx = Number(im.dataset.i); showModalImage(); });
  });
}
$("#galPrev").addEventListener("click", () => { modalImgIdx = (modalImgIdx - 1 + modalImages.length) % modalImages.length; showModalImage(); });
$("#galNext").addEventListener("click", () => { modalImgIdx = (modalImgIdx + 1) % modalImages.length; showModalImage(); });

function closeModal(){ modal.classList.remove("show"); if(!drawer.classList.contains("open")) overlay.classList.remove("show"); }

/* ===== 抽屉 ===== */
function openDrawer(){ drawer.classList.add("open"); overlay.classList.add("show"); renderCart(); }
function closeDrawer(){ drawer.classList.remove("open"); if(!modal.classList.contains("show")) overlay.classList.remove("show"); }

/* ===== 事件 ===== */
document.querySelectorAll("[data-goto]").forEach(btn => {
  btn.addEventListener("click", () => {
    const el = document.getElementById(btn.dataset.goto);
    if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  });
});
document.querySelectorAll("[data-filter-new]").forEach(btn => {
  btn.addEventListener("click", () => {
    filter = "new"; query = "";
    $("#searchInput").value = "";
    renderChips();
    renderGrid();
    $("#shop").scrollIntoView({behavior:"smooth", block:"start"});
  });
});
$("#filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.cat;
  renderChips();
  renderGrid();
});
$("#searchInput").addEventListener("input", e => { query = e.target.value; renderGrid(); });
$("#cartBtn").addEventListener("click", openDrawer);
$("#drawerClose").addEventListener("click", closeDrawer);
$("#modalClose").addEventListener("click", closeModal);
$("#footerCartLink").addEventListener("click", openDrawer);
$("#fAbout").addEventListener("click", () => toast(t("f_about") + " · KDGOGO Mall"));
$("#fPolicy").addEventListener("click", () => toast(t("f_policy")));
$("#fContact").addEventListener("click", () => toast(t("f_contact")));
$("#fShipping").addEventListener("click", () => toast(t("f_shipping")));
$("#overlay").addEventListener("click", () => { closeModal(); closeDrawer(); });

grid.addEventListener("click", e => {
  const addBtn = e.target.closest("[data-add]");
  if (addBtn){ e.stopPropagation(); addToCart(parseInt(addBtn.dataset.add,10), 1); return; }
  const card = e.target.closest(".card");
  if (card) openModal(parseInt(card.dataset.id,10));
});

$("#drawerBody").addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]");
  const dec = e.target.closest("[data-dec]");
  const rm = e.target.closest("[data-rm]");
  const go = e.target.closest("#goShop");
  if (go){ closeDrawer(); $("#shop").scrollIntoView({behavior:"smooth"}); return; }
  const id = (inc||dec||rm)?.dataset[(inc?"inc":dec?"dec":"rm")];
  if (!id) return;
  const pid = parseInt(id,10);
  if (inc){ cart[pid] = (cart[pid]||0) + 1; }
  else if (dec){ cart[pid] = Math.max(0, (cart[pid]||1) - 1); if(!cart[pid]) delete cart[pid]; }
  else { delete cart[pid]; toast(t("removed")); }
  saveCart();
});

$("#qtyMinus").addEventListener("click", () => { modalQty = Math.max(1, modalQty-1); $("#qtyVal").textContent = modalQty; });
$("#qtyPlus").addEventListener("click", () => { modalQty = Math.min(99, modalQty+1); $("#qtyVal").textContent = modalQty; });
$("#modalAdd").addEventListener("click", () => { if(modalId) addToCart(modalId, modalQty); });

$("#checkoutBtn").addEventListener("click", () => { if(!cartCount()){ toast(t("cart_empty_first")); return; } location.href = "checkout.html"; });
$("#clearBtn").addEventListener("click", () => { if(!cartCount()){ toast(t("cart_already_empty")); return; } cart = {}; saveCart(); toast(t("cart_cleared")); });

initLangSelect(() => { renderChips(); renderGrid(); renderCart(); });

/* 移动端导航菜单 */
const navToggle = $("#navToggle"), mainNav = $(".main-nav");
navToggle.addEventListener("click", () => mainNav.classList.toggle("open"));
mainNav.addEventListener("click", e => { if (e.target.closest(".nav-link")) mainNav.classList.remove("open"); });

document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeModal(); closeDrawer(); } });

/* ===== 启动 ===== */
applyLang();
$("#statCount").textContent = PRODUCTS.length;
renderChips();
renderGrid();
renderCart();

/* 从后端 API 加载商品；失败时保留内置演示数据 */
async function loadProducts(){
  try{
    const res = await fetch("/api/products", { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("API " + res.status);
    const data = await res.json();
    if (data.ok && Array.isArray(data.products) && data.products.length){
      PRODUCTS = data.products.map(p => ({
        id: p.id, name: p.name, category: p.category, cat: p.category, catName: p.catName,
        description: p.description || "", desc: p.description || "",
        i18n: p.i18n || {},
        price: p.price, rating: p.rating, isNew: !!p.isNew,
        img: p.image || "assets/hero.jpg",
        feats: Array.isArray(p.feats) ? p.feats : [],
        images: Array.isArray(p.images) && p.images.length ? p.images : [p.image || "assets/hero.jpg"],
        on_sale: !!p.on_sale,
        stock: p.stock ?? 100, brand: p.brand || "", model: p.model || "",
        original_price: p.original_price || 0,
        free_shipping: p.free_shipping !== false, shipping_fee: p.shipping_fee || 0
      }));
      $("#statCount").textContent = PRODUCTS.length;
      renderChips();
      renderGrid();
      renderCart();
    }
  }catch(e){
    /* API 不可用时保持内置演示数据 */
  }
}
loadProducts();
</script>
</body>
</html>
